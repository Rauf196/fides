syntax = "proto3";

package fides.ledger.v1;

// 5 fundamental account categories from the accounting equation
enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_ASSET = 1;
  ACCOUNT_TYPE_LIABILITY = 2;
  ACCOUNT_TYPE_EQUITY = 3;
  ACCOUNT_TYPE_REVENUE = 4;
  ACCOUNT_TYPE_EXPENSE = 5;
}

// determines which side (debit/credit) increases the balance
enum NormalBalance {
  NORMAL_BALANCE_UNSPECIFIED = 0;
  NORMAL_BALANCE_DEBIT = 1;
  NORMAL_BALANCE_CREDIT = 2;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_DEBIT = 1;
  ENTRY_TYPE_CREDIT = 2;
}

enum EntryStatus {
  ENTRY_STATUS_UNSPECIFIED = 0;
  ENTRY_STATUS_PENDING = 1;   // authorized but not settled
  ENTRY_STATUS_POSTED = 2;    // settled
  ENTRY_STATUS_VOIDED = 3;    // cancelled
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_POSTED = 2;
  TRANSACTION_STATUS_VOIDED = 3;
  TRANSACTION_STATUS_FAILED = 4;
}

message Account {
  int64 id = 1;
  AccountType account_type = 2;
  NormalBalance normal_balance = 3;
  string asset_code = 4;   // "USD", "EUR", "BTC"
  int32 asset_scale = 5;   // decimal places (2 for cents, 8 for satoshis)
  int64 version = 6;       // for optimistic locking
  int64 created_at = 7;    // unix millis
}

// single leg of a double-entry transaction (immutable once created)
message Entry {
  int64 id = 1;
  int64 transaction_id = 2;
  int64 account_id = 3;
  EntryType entry_type = 4;
  int64 amount = 5;          // always positive, in smallest unit (cents, satoshis)
  EntryStatus status = 6;
  int64 created_at = 7;      // unix millis
}

// groups entries that must balance (total debits = total credits)
message Transaction {
  int64 id = 1;
  string idempotency_key = 2;  // client-generated uuid to prevent duplicates
  TransactionStatus status = 3;
  int64 created_at = 4;        // unix millis
  int64 posted_at = 5;         // 0 if not yet posted
}

// computed balance for an account
message Balance {
  int64 posted = 1;     // settled balance
  int64 pending = 2;    // sum of pending holds
  int64 available = 3;  // posted - pending
}

// input for a single leg of a transaction
message TransferLeg {
  int64 account_id = 1;
  EntryType entry_type = 2;
  int64 amount = 3;  // must be > 0
}

// requests and responses

message CreateAccountRequest {
  AccountType account_type = 1;
  string asset_code = 2;
  int32 asset_scale = 3;
}

message CreateAccountResponse {
  Account account = 1;
}

message GetAccountRequest {
  int64 account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message GetBalanceRequest {
  int64 account_id = 1;
}

message GetBalanceResponse {
  Balance balance = 1;
}

message AuthorizeRequest {
  string idempotency_key = 1;        // client-generated uuid
  repeated TransferLeg legs = 2;     // must balance (debits = credits)
  string metadata = 3;               // json string for audit context
}

message AuthorizeResponse {
  Transaction transaction = 1;
  repeated Entry entries = 2;
}

message CaptureRequest {
  int64 transaction_id = 1;
}

message CaptureResponse {
  Transaction transaction = 1;
}

message VoidRequest {
  int64 transaction_id = 1;
}

message VoidResponse {
  Transaction transaction = 1;
}

message GetEntriesRequest {
  int64 account_id = 1;
}

service LedgerService {
  // account management
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  // two-phase transactions
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  rpc Capture(CaptureRequest) returns (CaptureResponse);
  rpc Void(VoidRequest) returns (VoidResponse);

  // audit
  rpc GetEntries(GetEntriesRequest) returns (stream Entry);
}
